[project]
name = "incidentlens-api"
version = "0.1.0"
description = "IncidentLens API - AI incident triage copilot backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "fastembed>=0.9.0",
    "openai>=3.35.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "db: needs the local PostgreSQL test database (skipped if TEST_DATABASE_NAME is unset)",
    "model: loads the real FastEmbed model (skipped if fastembed is not installed)",
]
