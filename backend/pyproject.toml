[project]
name = "incidentlens-api"
version = "0.1.0"
description = "IncidentLens API - AI incident triage copilot backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
